<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PathSnap � Route explorer</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f2f5f1;color:#153e36;font:16px "Segoe UI",Arial,sans-serif}main{max-width:1060px;margin:auto;padding:30px 24px}header{display:flex;align-items:center;gap:10px;padding-bottom:20px;border-bottom:1px solid #c1cfc6;font-weight:700}.mark{width:19px;height:19px;border:5px solid #187969;border-radius:50% 50% 50% 0;transform:rotate(-45deg)}h1{font:normal clamp(34px,6vw,62px) Georgia,serif;margin:34px 0 20px}form,.stats,.legend{display:flex;gap:16px;align-items:end;flex-wrap:wrap}form{margin-bottom:20px}label{display:grid;gap:6px}select,button{font:inherit;border:1px solid #a9bcb4;border-radius:6px;padding:9px 14px}button{background:#125849;color:white;cursor:pointer}button:disabled{opacity:.5}figure{margin:0;background:#fff;border:1px solid #c8d3ca;border-radius:12px;padding:18px}canvas{display:block;width:100%;height:390px;background:#f7f8f3;border-radius:8px}.legend{align-items:center;font-size:14px;margin-bottom:12px}.legend label{display:flex;align-items:center;gap:5px}.stats{margin:18px 0 0;gap:30px}.stats dt{font-size:13px;color:#475e53}.stats dd{margin:4px 0;font:26px Georgia,serif}#status{min-height:1.3em} @media(max-width:550px){main{padding:18px 12px}canvas{height:300px}}
</style><main><header><i class="mark"></i>PathSnap</header><h1>Route explorer</h1><form><label>Trip<select id="trip" aria-label="Trip"></select></label><button disabled>Reconstruct route</button></form>
<p id="status" role="status">Connecting to the model server.</p><figure><div class="legend"><label><input id="road" type="checkbox" checked>Predicted road</label><label><input id="gps" type="checkbox" checked>GPS points</label></div><canvas aria-label="Geographic plot of GPS points and predicted road segments"></canvas><dl class="stats"></dl></figure></main>
<script>
const $=s=>document.querySelector(s),sel=$('#trip'),btn=$('button'),statusBox=$('#status'),cv=$('canvas');let result=null;
async function api(url,options){const res=await fetch(url,options);const data=await res.json();if(!res.ok)throw Error(data.detail||'Request failed');return data}
function draw(){const r=cv.getBoundingClientRect(),ratio=devicePixelRatio||1;cv.width=r.width*ratio;cv.height=r.height*ratio;const c=cv.getContext('2d');c.scale(ratio,ratio);if(!result)return;
const pts=result.gps.concat(result.segments.flat());let loX=Infinity,hiX=-Infinity,loY=Infinity,hiY=-Infinity;for(const [x,y] of pts){loX=Math.min(loX,x);hiX=Math.max(hiX,x);loY=Math.min(loY,y);hiY=Math.max(hiY,y)}
const cos=Math.cos((loY+hiY)*Math.PI/360),scale=Math.min((r.width-32)/Math.max((hiX-loX)*cos,.000001),(r.height-32)/Math.max(hiY-loY,.000001));
const xy=([x,y])=>[r.width/2+(x-(loX+hiX)/2)*cos*scale,r.height/2-(y-(loY+hiY)/2)*scale];
if($('#road').checked){c.strokeStyle='#177867';c.lineWidth=4;c.beginPath();for(const [a,b] of result.segments){c.moveTo(...xy(a));c.lineTo(...xy(b))}c.stroke()}
if($('#gps').checked){c.fillStyle='#b74c32';for(const pt of result.gps){const [x,y]=xy(pt);c.fillRect(x-1,y-1,2,2)}}}
function metric(label,value){const div=document.createElement('div');const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=label;dd.textContent=value;div.append(dt,dd);$('.stats').append(div)}
async function run(e){if(e)e.preventDefault();if(!sel.value)return;btn.disabled=true;sel.disabled=true;result=null;draw();$('.stats').replaceChildren();statusBox.textContent='Reconstructing trip '+sel.value+'.';
try{result=await api('/match/'+sel.value,{method:'POST'});draw();metric('GPS observations',result.observations.toLocaleString());metric('Model',result.model);metric('Inference',result.inference_seconds+' s');if(result.metrics){metric('Aligned Top-1',(100*result.metrics.top1).toFixed(1)+'%');metric('Continuity',(100*result.metrics.continuity).toFixed(1)+'%')}statusBox.textContent='Trip '+result.trip+(result.metrics?' � scored on the server':' � reference unavailable');}
catch(e){statusBox.textContent=e.message}finally{btn.disabled=false;sel.disabled=false}}
$('form').onsubmit=run;$('#road').onchange=draw;$('#gps').onchange=draw;new ResizeObserver(draw).observe(cv);
api('/trips').then(({trips})=>{for(const id of trips)sel.add(new Option(id,id));btn.disabled=!trips.length;statusBox.textContent=trips.length?'Select a trip to reconstruct its route.':'No trip folders found.'}).catch(e=>statusBox.textContent=e.message);
</script></html>
